}

function hideBusy() {
  const el = document.getElementById("busy");
  if (el) el.remove();
}

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

/* ---------------------------- picker / sources ---------------------------- */
function embeddedWarning() {
  openModal({
    title: "Folder access is blocked here",
    sub: "This preview runs inside a sandboxed frame",
    iconName: "alert",
    iconTone: "danger",
    body: `<p style="font-size:12.5px;line-height:1.65;color:var(--ink-2)">
      Browsers only allow the folder picker on a top-level page. Open Explorchive in its own tab —
      the picker, file moves and local scanning will all work there.
    </p>
    <div class="banner info" style="margin-top:14px">${icon("info")}<div class="b-body">Your files are never uploaded. Scanning and moving happens on your device with the File System Access API.</div></div>`,
    actions: [
      { label: "Try demo instead", icon: "sparkles", onClick: (close) => { close(); if (!demoActive()) { loadDemo(); saveSettings({ demoHidden: true }); render(); } } },
      { label: "Open in new tab", icon: "external", cls: "primary", onClick: () => window.open(location.href, "_blank", "noopener") },
    ],
  });
}

async function pickFolder() {
  if (!window.showDirectoryPicker) {
    const input = document.getElementById("fallback-input");
    if (input) input.click();
    else toast("Folder picking is not supported in this browser. Try Chrome, Edge or Brave.", "err");
    return;
  }
  try {
    const handle = await window.showDirectoryPicker({ id: "explorchive", mode: "readwrite", startIn: "documents" });
    await addSource(handle);
  } catch (err) {
    if (err && (err.name === "AbortError" || err.code === 20)) return;
    if (err && err.name === "SecurityError") embeddedWarning();
    else toast((err && err.message) || "Could not open that folder.", "err");
  }
}

async function addSource(handle) {
  hideDemo();
  const exists = state.sources.some((s) => s.id === handle.name && !s.demo);
  const source = {
    id: exists ? handle.name + "-" + uid().slice(0, 5) : handle.name,
    name: handle.name,
    handle,
    demo: false,
    writable: true,
    status: "ready",
    addedAt: Date.now(),
  };
  state.sources = state.sources.filter((s) => !s.demo).concat(source);
  saveSettings({ demoHidden: true, onboarded: true });
  await idbSaveSource(source);
  await scanSource(source);
  if (state.view !== "files") navigate("files");
  render();
}

function hideDemo() {
  if (state.sources.some((s) => s.demo)) {
    state.sources = state.sources.filter((s) => !s.demo);
    state.files = state.files.filter((f) => !f.demo);
    state.folders = state.folders.filter((f) => !f.demo);
    state.scannedAt = null;
    state.dupes = { groups: null, reclaimable: 0, busy: false, strict: false, scannedAt: null };
    state.selection.clear();
    state.organize.plan = null;
  }
}

function fallbackFilesPicked(input) {
  const files = Array.from(input.files || []);
  if (!files.length) return;
  const first = files[0].webkitRelativePath || files[0].name;
  const rootName = first.split("/")[0] || "Selected folder";
  hideDemo();
  const raw = files.map((f) => {
    const rel = f.webkitRelativePath || f.name;
    const path = rel.split("/").slice(1).join("/") || f.name;
    return { f, path };
  });
  const source = {
    id: "fallback-" + uid().slice(0, 6),
    name: rootName,
    demo: false,
    handle: null,
    rawFiles: raw,
    writable: false,
    readonly: true,
    status: "ready",
    addedAt: Date.now(),
  };
  state.sources = state.sources.filter((s) => !s.demo).concat(source);
  state.files = state.files.filter((x) => x.rootId !== source.id);
  state.folders = state.folders.filter((x) => x.rootId !== source.id);
  raw.forEach(({ f, path }) => {
    state.files.push({
      id: uid(), rootId: source.id, demo: false, path,
      dir: dirOfPath(path), name: baseOfPath(path), ext: extOf(path),
      size: f.size, mtime: f.lastModified || Date.now(),
      category: categoryOf(path), handle: null, parentHandle: null, rawFile: f,
    });
  });
  const set = new Set();
  raw.forEach(({ path }) => { let d = dirOfPath(path); while (d) { set.add(d); d = dirOfPath(d); } });
  set.forEach((path) => state.folders.push({
    path, name: baseOfPath(path), depth: path.split("/").length,
    rootId: source.id, demo: false, handle: null, parentHandle: null,
  }));
  state.scannedAt = Date.now();
  state.selection.clear();
  saveSettings({ demoHidden: true, onboarded: true, lastScan: Date.now() });
  toast("Scanned " + fmtCount(state.files.length) + " files (read-only mode)", "ok");
  input.value = "";
  navigate("files");
  render();
}

async function removeSource(id) {
  const source = sourceById(id);
  if (!source) return;
  const ok = await confirmModal({
    title: "Remove this folder?",
    message: `Explorchive will forget <strong>${esc(source.name)}</strong> and clear its ${fmtCount(filesForRoot(id))} files from the library. Your real files stay untouched.`,
    confirmLabel: "Remove folder",
    tone: "danger",
    iconName: "files",
  });
  if (!ok) return;
  state.sources = state.sources.filter((s) => s.id !== id);
  state.files = state.files.filter((f) => f.rootId !== id);
  state.folders = state.folders.filter((f) => f.rootId !== id);
  state.selection.clear();
  state.dupes = { groups: null, reclaimable: 0, busy: false, strict: false, scannedAt: null };
  state.organize.plan = null;
  if (!state.sources.length) {
    state.scannedAt = null;
    state.files = [];
    state.folders = [];
  }
  await idbDeleteSource(id);
  if (!state.sources.length && !state.settings.demoHidden) loadDemo();
  toast("Folder removed from library", "info");
  render();
}

function filesForRoot(id) { return state.files.filter((f) => f.rootId === id); }

async function reconnectSource(id) {
  const source = sourceById(id);
  if (!source) return;
  if (source.demo) { toast("Demo library is already available", "info"); return; }
  if (!source.handle) { toast("Re-select this folder to grant access", "info"); return; }
  try {
    const opts = { mode: "readwrite" };
    const granted = await source.handle.requestPermission(opts);
    if (granted !== "granted") {
      const ro = await source.handle.requestPermission({ mode: "read" });
      if (ro !== "granted") { toast("Permission denied for " + source.name, "err"); return; }
      source.writable = false;
    } else {
      source.writable = true;
    }
    source.status = "ready";
    await scanSource(source);
    render();
  } catch (err) {
    toast((err && err.message) || "Could not reconnect that folder.", "err");
  }
}

async function restoreSources() {
  const saved = await idbAllSources();
  if (!saved.length) return false;
  state.sources = saved.map((s) => ({
    id: s.id, name: s.name, handle: s.handle, demo: false,
    writable: true, status: "unknown", addedAt: s.addedAt,
  }));
  state.restoring = true;
  let any = false;
  for (const source of state.sources) {
    try {
      const perm = await source.handle.queryPermission({ mode: "read" });
      if (perm === "granted") {
        await scanSource(source);
        any = true;
      } else {
        source.status = "needs-permission";
      }
    } catch {
      source.status = "needs-permission";
    }
  }
  state.restoring = false;
  void any;
  return true;
}

/* ---------------------------- scanning ---------------------------- */
async function scanAll({ quiet = false } = {}) {
  if (state.scanning) return;
  if (!activeSources().some((s) => s.handle)) {
    if (!quiet) toast("Pick a folder first — Explorchive will scan it locally", "info");
    return;
  }
  state.scanning = true;
  for (const source of activeSources()) {
    if (!source.handle) continue;
    try {
      const perm = await source.handle.queryPermission({ mode: "read" });
      if (perm !== "granted") { source.status = "needs-permission"; continue; }
      await scanSource(source);
    } catch (err) {
      source.status = "error";
      toast("Could not scan " + source.name + ": " + (err.message || err.name), "err");
    }
  }
  state.scanning = false;
  state.scannedAt = Date.now();
  saveSettings({ lastScan: Date.now() });
  state.dupes = { groups: null, reclaimable: 0, busy: false, strict: false, scannedAt: null };
  state.selection.clear();
  state.organize.plan = null;
  render();
  if (!quiet) toast("Library updated — " + fmtCount(state.files.length) + " files in view", "ok");
  await runAutopilot();
}

/* ---------------------------- autopilot ---------------------------- */
async function runAutopilot() {
  const auto = state.settings.autopilot || {};
  if (!auto.enabled) return;
  if (!state.files.length || state.organize.busy) return;
  if (!state.sources.some((s) => !s.demo)) return;
  const previous = { scheme: state.organize.scheme, include: state.organize.includeSubfolders };
  state.organize.scheme = SCHEMES[auto.scheme] ? auto.scheme : "type";
  state.organize.includeSubfolders = !!auto.includeSubfolders;
  const plan = buildOrganizePlan();
  if (!plan.length) {
    state.organize.scheme = previous.scheme;
    state.organize.includeSubfolders = previous.include;
    return;
  }
  state.organize.plan = plan;
  toast(`Auto-organize is on — moving ${plan.length} ${plural(plan.length, "file", "files")}`, "info", "Autopilot");
  await applyOrganizePlan();
  // Autopilot has its own settings; leave the manual organize page as the user left it.
  state.organize.scheme = previous.scheme;
  state.organize.includeSubfolders = previous.include;
  render();
}

async function scanSource(source) {
  if (!source.handle) return;
  const files = [];
  const folders = [];
  const started = performance.now();
  source.status = "scanning";
  source.scanned = 0;
  showBusy("Scanning " + source.name, "Reading folder…");

  const walk = async (dirHandle, path, depth, parentHandle) => {
    if (depth > 24) return;
    let entries;
    try { entries = dirHandle.entries(); } catch { return; }
    for await (const [name, handle] of entries) {
      const childPath = path ? path + "/" + name : name;
      if (handle.kind === "directory") {
        folders.push({
          path: childPath, name, depth: depth + 1, rootId: source.id,
          demo: false, handle, parentHandle: dirHandle,
        });
        await walk(handle, childPath, depth + 1, dirHandle);
      } else {
        try {
          const f = await handle.getFile();
          files.push({
            id: source.id + ":" + childPath,
            rootId: source.id, demo: false, path: childPath,
            dir: path, name, ext: extOf(name), size: f.size,
            mtime: f.lastModified || Date.now(), category: categoryOf(name),
            handle, parentHandle: dirHandle,
          });
          source.scanned++;
          if (source.scanned % 40 === 0) {
            updateBusy(fmtCount(source.scanned) + " files · " + childPath);
            await sleep(0);
          }
        } catch { /* unreadable entry — skip */ }
      }
    }
  };

  try {
    await walk(source.handle, "", 0, null);
    source.status = "ready";
    source.writable = true;
    source.scannedAt = Date.now();
    source.duration = Math.round(performance.now() - started);
  } catch (err) {
    source.status = "error";
    source.error = err.message || String(err);
    if (err.name === "NotAllowedError") source.status = "needs-permission";
  } finally {
    hideBusy();
  }

  state.files = state.files.filter((f) => f.rootId !== source.id).concat(files);
  state.folders = state.folders.filter((f) => f.rootId !== source.id).concat(folders);
  state.scannedAt = Date.now();
  state.scanning = false;
  state.filters.page = 1;
  state.selection.clear();
  dirCache.clear();
  saveSettings({ lastScan: Date.now(), demoHidden: true });
}

/* ---------------------------- permissions ---------------------------- */
async function ensureWritable(source) {
  if (!source) return false;
  if (source.demo) return true;
  if (source.rawFiles || source.readonly) {
    toast("This folder was loaded read-only (browser fallback). Use Chrome or Edge for write access.", "err");
    return false;
  }
  if (!source.handle) return false;
  try {
    const opts = { mode: "readwrite" };
    if ((await source.handle.queryPermission(opts)) === "granted") { source.writable = true; return true; }
    const result = await source.handle.requestPermission(opts);
    source.writable = result === "granted";
    if (!source.writable) toast("Write permission is needed to move or delete files in " + source.name, "err");
    return source.writable;
  } catch {
    return false;
  }
}

async function getDirHandle(source, path, create = false) {
  const key = source.id + "|" + path + "|" + (create ? "w" : "r");
  if (dirCache.has(key)) return dirCache.get(key);
  let current = source.handle;
  const segments = path.split("/").filter(Boolean);
  let walked = "";
  for (const segment of segments) {
    walked = walked ? walked + "/" + segment : segment;
    const stepKey = source.id + "|" + walked + "|w";
    if (dirCache.has(stepKey)) { current = dirCache.get(stepKey); continue; }
    current = await current.getDirectoryHandle(segment, { create });
    dirCache.set(stepKey, current);
  }
  dirCache.set(key, current);
  return current;
}

/* ---------------------------- moving / deleting ---------------------------- */
async function moveEntry(fileObj, destDirHandle, newName) {
  const oldName = fileObj.name;
  // Fast path: native move (Chromium 111+). Keeps the file, no copy.
  if (fileObj.handle && typeof fileObj.handle.move === "function") {
    try {
      if (newName !== oldName) await fileObj.handle.move(destDirHandle, newName);
      else await fileObj.handle.move(destDirHandle);
      return await destDirHandle.getFileHandle(newName);
    } catch { /* fall through to copy */ }
  }
  // Fallback: stream copy, then remove the original.
  const file = await fileObj.handle.getFile();
  const destHandle = await destDirHandle.getFileHandle(newName, { create: true });
  const writable = await destHandle.createWritable();
  try {
    await writable.write(file);
    await writable.close();
  } catch (err) {
    try { await writable.abort(); } catch {}
    throw err;
  }
  await fileObj.parentHandle.removeEntry(oldName);
  return destHandle;
}

async function deleteFileObjects(files, { confirm = false } = {}) {
  if (!files.length) return { deleted: 0, failed: 0 };
  if (confirm) {
    const total = sum(files, (f) => f.size);
    const ok = await confirmModal({
      title: `Delete ${fmtCount(files.length)} ${plural(files.length, "file", "files")}?`,
      message: `This removes <strong>${fmtByteLabel(total)}</strong> permanently from your device. Deleted files do not go to the system trash and cannot be restored by Explorchive.`,
      confirmLabel: "Delete permanently",
      tone: "danger",
      iconName: "trash",
    });
    if (!ok) return { deleted: 0, failed: 0, cancelled: true };
  }
  const deleted = [];
  let failed = 0;
  const byRoot = new Map();
  files.forEach((f) => {
    const list = byRoot.get(f.rootId) || [];
    list.push(f);
    byRoot.set(f.rootId, list);
  });
  for (const [rootId, group] of byRoot) {
    const source = sourceById(rootId);
    if (!source) { failed += group.length; continue; }
    if (!source.demo) {
      const allowed = await ensureWritable(source);
      if (!allowed) { failed += group.length; continue; }
    }
    for (const f of group) {
      if (source.demo) { deleted.push(f.id); continue; }
      try {
        if (!f.parentHandle) throw new Error("read-only");
        await f.parentHandle.removeEntry(f.name);
        deleted.push(f.id);
      } catch { failed++; }
    }
  }
  const deletedSet = new Set(deleted);
  state.files = state.files.filter((f) => !deletedSet.has(f.id));
  state.selection.forEach((id) => { if (deletedSet.has(id)) state.selection.delete(id); });
  state.cleanupSelection.clear();
  if (state.dupes.groups) {
    state.dupes.groups = state.dupes.groups.map((g) => {
      const kept = g.files.filter((f) => !deletedSet.has(f.id));
      return kept.length > 1 ? { ...g, files: kept, wasted: g.size * (kept.length - 1) } : null;
    }).filter(Boolean);
    state.dupes.reclaimable = sum(state.dupes.groups, (g) => g.wasted);
  }
  if (state.organize.plan) state.organize.plan = state.organize.plan.filter((p) => !deletedSet.has(p.fileId));
  if (deleted.length) toast(`Deleted ${fmtCount(deleted.length)} ${plural(deleted.length, "file", "files")} · ${fmtBytes(sum(files.filter((f) => deletedSet.has(f.id)), (f) => f.size))} freed`, "ok");
  if (failed) toast(`${fmtCount(failed)} ${plural(failed, "file was", "files were")} not deleted — permission or read-only folder`, "err");
  render();
  return { deleted: deleted.length, failed };
}

async function deleteFolderObject(folder) {
  const source = sourceById(folder.rootId);
  if (!source) return false;
  if (source.demo) return true;
  if (!(await ensureWritable(source))) return false;
  try {
    if (folder.parentHandle) await folder.parentHandle.removeEntry(folder.name);
    else if (source.handle) await source.handle.removeEntry(folder.name);
    return true;
  } catch { return false; }
}

/* ---------------------------- organizing ---------------------------- */
const SCHEMES = {
  type: { name: "By file type", desc: "Images, Documents, Video, Audio…", icon: "layers" },
  month: { name: "By year & month", desc: "2025 / 03 – March", icon: "clock" },
  year: { name: "By year", desc: "2023, 2024, 2025", icon: "sun" },
  project: { name: "By project", desc: "Keep the project, sort inside it", icon: "folder" },
};

const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

function destSegmentsFor(file, scheme) {
  const d = new Date(file.mtime || Date.now());
  const yyyy = String(d.getFullYear());
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const catFolder = CATEGORIES[file.category] ? CATEGORIES[file.category].folder : "Other";
  if (scheme === "month") return [yyyy, `${mm} - ${MONTH_NAMES[d.getMonth()]}`];
  if (scheme === "year") return [yyyy];
  if (scheme === "project") {
    const top = file.dir ? file.dir.split("/")[0] : "";
    return top ? [top, catFolder] : ["Loose files", catFolder];
  }
  return [catFolder];
}

function uniqueName(destDir, name, used) {
  const key = destDir + "|" + name.toLowerCase();
  if (!used.has(key)) { used.add(key); return name; }
  const ext = extOf(name);
  const base = ext ? name.slice(0, -(ext.length + 1)) : name;
  let n = 2;
  while (true) {
    const candidate = `${base} (${n})${ext ? "." + ext : ""}`;
    const k = destDir + "|" + candidate.toLowerCase();
    if (!used.has(k)) { used.add(k); return candidate; }
    n++;
  }
}

function buildOrganizePlan() {
  const scheme = state.organize.scheme;
  const include = state.organize.includeSubfolders;
  const candidates = state.files.filter((f) => include || !f.dir);
  const used = new Set();
  const movingIds = new Set(candidates.map((f) => f.id));
  state.files.forEach((f) => {
    if (!movingIds.has(f.id)) used.add(f.dir + "|" + f.name.toLowerCase());
  });
  const plan = [];
  for (const f of candidates) {
    const segments = destSegmentsFor(f, scheme);
    const destDir = segments.join("/");
    if (destDir === f.dir) continue;
    const newName = uniqueName(destDir, f.name, used);
    plan.push({
      fileId: f.id, name: f.name, newName, renamed: newName !== f.name,
      srcDir: f.dir, srcPath: f.path, destDir, destPath: destDir + "/" + newName,
      size: f.size, category: f.category, mtime: f.mtime, rootId: f.rootId,
    });
  }
  return plan;
}

function planSummary(plan) {
  const folders = new Set(plan.map((p) => p.destDir));
  return {
    count: plan.length,
    folders: folders.size,
    bytes: sum(plan, (p) => p.size),
    renamed: plan.filter((p) => p.renamed).length,
    categories: Array.from(new Set(plan.map((p) => p.category))),
  };
}

async function applyOrganizePlan() {
  const plan = state.organize.plan;
  if (!plan || !plan.length) return;
  state.organize.busy = true;
  state.organize.progress = 0;
  state.organize.total = plan.length;
  render();

  if (demoActive()) {
    await sleep(450);
    const moved = [];
    for (const item of plan) {
      const f = fileById(item.fileId);
      if (!f) continue;
      const oldPath = f.path;
      f.dir = item.destDir;
      f.path = item.destPath;
      f.name = item.newName;
      moved.push({ fileId: f.id, from: oldPath, to: f.path });
    }
    rebuildFoldersFromFiles();
    state.organize.undo = { at: Date.now(), count: moved.length, ops: moved, demo: true };
    state.organize.plan = null;
    state.organize.busy = false;
    state.files.sort((a, b) => a.path.localeCompare(b.path));
    render();
    toast(`${fmtCount(moved.length)} files organized in the demo library`, "ok", "Organized");
    return;
  }

  showBusy("Organizing files", "Preparing destinations…");
  const ops = [];
  let done = 0;
  let failures = 0;
  const permissionCache = new Map();

  for (const item of plan) {
    const f = fileById(item.fileId);
    const source = f && sourceById(f.rootId);
    if (!f || !source || !f.handle || !f.parentHandle) { failures++; continue; }
    if (!permissionCache.has(source.id)) permissionCache.set(source.id, await ensureWritable(source));
    if (!permissionCache.get(source.id)) { failures += plan.length - done; break; }
    try {
      const destDirHandle = await getDirHandle(source, item.destDir, true);
      const oldPath = f.path;
      await moveEntry(f, destDirHandle, item.newName);
      f.dir = item.destDir;
      f.path = item.destPath;
      f.name = item.newName;
      f.parentHandle = destDirHandle;
      ops.push({
        fileId: f.id, destDir: item.destDir, newName: item.newName,
        srcDir: item.srcDir, name: item.name, oldPath, newPath: item.destPath,
      });
      done++;
    } catch (err) {
      failures++;
    }
    state.organize.progress = done + failures;
    if (done % 3 === 0 || done === plan.length) {
      updateBusy(`Moving ${done} of ${plan.length} — ${f.name}`, state.organize.progress / plan.length);
      // update in-view progress if visible
      const bar = document.querySelector("[data-organize-bar]");
      if (bar) bar.style.width = pct(state.organize.progress, plan.length) + "%";
      const label = document.querySelector("[data-organize-label]");
      if (label) label.textContent = `${done} / ${plan.length} moved`;
      await sleep(0);
    }
  }

  rebuildFoldersFromFiles();
  state.organize.undo = ops.length ? { at: Date.now(), count: ops.length, ops, demo: false } : null;
  state.organize.plan = null;
  state.organize.busy = false;
  hideBusy();
  state.files.sort((a, b) => a.path.localeCompare(b.path));
  render();
  if (done) toast(`${fmtCount(done)} files moved into place${failures ? ` · ${failures} skipped` : ""}`, "ok", "Organized");
  if (failures) toast(`${fmtCount(failures)} files could not be moved. Some browsers block moving large files — they were skipped.`, "err");
}

async function undoOrganize() {
  const undo = state.organize.undo;
  if (!undo || !undo.ops.length) return;
  showBusy("Restoring original locations", "Undoing the last organize…");
  let restored = 0;
  let failed = 0;

  if (undo.demo) {
    for (const op of undo.ops) {
      const f = fileById(op.fileId);
      if (!f) continue;
      f.path = op.from;
      f.dir = dirOfPath(op.from);
      f.name = baseOfPath(op.from);
      restored++;
    }
  } else {
    for (const op of undo.ops) {
      const f = fileById(op.fileId);
      const source = f && sourceById(f.rootId);
      if (!f || !source) { failed++; continue; }
      try {
        if (!(await ensureWritable(source))) { failed++; continue; }
        const destHandle = await getDirHandle(source, op.srcDir, true);
        await moveEntry(f, destHandle, op.name);
        f.dir = op.srcDir;
        f.path = op.oldPath;
        f.name = op.name;
        f.parentHandle = destHandle;
        restored++;
      } catch { failed++; }
    }
  }
  rebuildFoldersFromFiles();
  state.organize.undo = null;
  hideBusy();
  render();
  toast(`Restored ${fmtCount(restored)} files${failed ? ` · ${failed} failed` : ""}`, failed ? "err" : "ok");
}

/* ---------------------------- hashing & duplicates ---------------------------- */
function bufferToHex(buf) {
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

async function hashFileObject(file) {
  if (file.demo) return "demo-" + file.name.toLowerCase() + "-" + file.size;
  if (file.rawFile) return "raw-" + file.rawFile.name + "-" + file.rawFile.size + "-" + file.name;
  if (!file.handle) return "nohandle-" + file.path;
  const f = await file.handle.getFile();
  const SLICE = 4 * 1024 * 1024;
  const FULL = 64 * 1024 * 1024;
  if (f.size <= FULL) {
    const buf = await f.slice(0, f.size).arrayBuffer();
    const digest = await crypto.subtle.digest("SHA-256", buf);
    return "full-" + f.size + "-" + bufferToHex(digest);
  }
  const head = await f.slice(0, SLICE).arrayBuffer();
  const tail = await f.slice(Math.max(0, f.size - SLICE), f.size).arrayBuffer();
  const digest = await crypto.subtle.digest("SHA-256", await new Blob([head, tail]).arrayBuffer());
  return "partial-" + f.size + "-" + bufferToHex(digest);
}

async function scanDuplicates() {
  if (state.dupes.busy || !state.files.length) return;
  const strict = state.dupes.strict;
  state.dupes.busy = true;
  closeModal();
  render();
  showBusy(strict ? "Hashing files" : "Comparing files", "Looking for same name and size…");
  await sleep(120);

  try {
    const groups = new Map();
    state.files.forEach((f) => {
      if (!f.size) return;
      const key = f.size + "|" + (strict ? "" : f.name.toLowerCase());
      const list = groups.get(key) || [];
      list.push(f);
      groups.set(key, list);
    });

    let candidates = Array.from(groups.values()).filter((g) => g.length > 1);
    let hashed = 0;
    const totalToHash = sum(candidates, (g) => g.length);

    if (strict) {
      const byHash = new Map();
      for (const group of candidates) {
        for (const f of group) {
          hashed++;
          if (hashed % 2 === 0) {
            updateBusy(`Hashing ${hashed} / ${totalToHash} — ${f.path}`, hashed / Math.max(1, totalToHash));
            await sleep(0);
          }
          let hash;
          try { hash = await hashFileObject(f); }
          catch { hash = "unreadable:" + f.path; }
          const key = f.size + "|" + hash;
          const list = byHash.get(key) || [];
          list.push(f);
          byHash.set(key, list);
        }
      }
      candidates = Array.from(byHash.values()).filter((g) => g.length > 1);
    }

    const result = candidates.map((files) => {
      const sorted = sortBy(files, (f) => f.mtime || 0);
      return {
        id: uid(),
        name: sorted[0].name,
        size: sorted[0].size,
        category: sorted[0].category,
        wasted: sorted[0].size * (sorted.length - 1),
        keepId: sorted[0].id,
        files: sorted,
      };
    }).sort((a, b) => b.wasted - a.wasted);

    state.dupes = {
      groups: result,
      reclaimable: sum(result, (g) => g.wasted),
      busy: false,
      strict,
      scannedAt: Date.now(),
      scannedCount: state.files.length,
    };
    hideBusy();
    render();
    if (result.length) toast(`${result.length} duplicate groups · ${fmtBytes(state.dupes.reclaimable)} reclaimable`, "ok", "Scan complete");
    else toast("No duplicates found. Your library is tidy.", "ok", "Scan complete");
  } catch (err) {
    state.dupes.busy = false;
    hideBusy();
    render();
    toast("Duplicate scan failed: " + (err.message || err.name), "err");
  }
}

function setKeep(groupId, fileId) {
  if (!state.dupes.groups) return;
  const group = state.dupes.groups.find((g) => g.id === groupId);
  if (group) { group.keepId = fileId; render(); }
}

async function deleteGroupExtras(groupId) {
  const group = state.dupes.groups && state.dupes.groups.find((g) => g.id === groupId);
  if (!group) return;
  const extras = group.files.filter((f) => f.id !== group.keepId);
  await deleteFileObjects(extras, { confirm: false });
}

/* ---------------------------- cleanup ---------------------------- */
function cleanupBuckets() {
  const now = Date.now();
  const YEAR = 365 * 86400000;
  const large = state.files.filter((f) => f.size >= 100 * 1024 * 1024);
  const old = state.files.filter((f) => f.mtime && now - f.mtime > YEAR);
  const junk = state.files.filter((f) => isJunk(f.name));
  const empties = emptyFolders();
  return {
    large: { key: "large", files: large, bytes: sum(large, (f) => f.size) },
    old: { key: "old", files: old, bytes: sum(old, (f) => f.size) },
    junk: { key: "junk", files: junk, bytes: sum(junk, (f) => f.size) },
    empty: { key: "empty", folders: empties, bytes: 0 },
  };
}

function emptyFolders() {
  const occupied = new Set();
  state.files.forEach((f) => {
    let dir = f.dir;
    while (dir) { occupied.add(dir); dir = dirOfPath(dir); }
  });
  return state.folders
    .filter((f) => !occupied.has(f.path))
    .sort((a, b) => b.depth - a.depth);
}

async function deleteEmptyFolders({ confirm = true } = {}) {
  const empties = emptyFolders();
  if (!empties.length) return;
  if (confirm) {
    const ok = await confirmModal({
      title: `Remove ${fmtCount(empties.length)} empty ${plural(empties.length, "folder", "folders")}?`,
      message: "Only folders with no files inside will be removed. This cannot be undone.",
      confirmLabel: "Remove folders",
      tone: "danger",
      iconName: "folder",
    });
    if (!ok) return;
  }
  let removed = 0;
  let failed = 0;
  for (const folder of empties) {
    const source = sourceById(folder.rootId);
    if (!source) { failed++; continue; }
    if (source.demo) { removed++; continue; }
    if (!(await ensureWritable(source))) { failed++; continue; }
    try {
      if (folder.parentHandle) await folder.parentHandle.removeEntry(folder.name);
      else if (source.handle) await source.handle.removeEntry(folder.name);
      removed++;
    } catch { failed++; }
  }
  const removedSet = new Set(empties.map((f) => f.path));
  state.folders = state.folders.filter((f) => !removedSet.has(f.path));
  render();
  toast(`${removed} empty ${plural(removed, "folder", "folders")} removed${failed ? ` · ${failed} skipped` : ""}`, failed ? "err" : "ok");
}

/* ---------------------------- previews & downloads ---------------------------- */
async function getBlobForFile(file) {
  if (file.rawFile) return file.rawFile;
  if (file.handle) { try { return await file.handle.getFile(); } catch { return null; } }
  return null;
}

async function previewData(file) {
  if (!file) return { type: "none" };
  if (file.demo) return { type: "demo", category: file.category };
  const blob = await getBlobForFile(file);
  if (!blob) return { type: "none" };
  const ext = file.ext;
  if (["jpg", "jpeg", "png", "gif", "webp", "bmp", "avif", "svg", "ico"].includes(ext) && blob.size < 25 * 1024 * 1024) {
    return { type: "image", url: URL.createObjectURL(blob) };
  }
  if (["txt", "md", "json", "js", "css", "html", "csv", "log", "yml", "yaml", "xml", "ts", "py", "sh", "sql"].includes(ext) && blob.size < 2 * 1024 * 1024) {
    const text = await blob.slice(0, 100 * 1024).text();
    return { type: "text", text };
  }
  return { type: "none" };
}

async function downloadFileObject(file) {
  if (!file) return;
  if (file.demo) {
    const content = `Explorchive demo file\n\nName: ${file.name}\nPath: ${file.path}\nSize: ${fmtBytes(file.size)}\nCategory: ${CATEGORIES[file.category].label}\nModified: ${dateTimeStr(file.mtime)}\n\nThis is a simulated file from the demo library. Connect a real folder to download the actual document.`;
    saveBlob(new Blob([content], { type: "text/plain" }), file.name + ".demo.txt");
    toast("Demo files are simulated — a preview summary was downloaded instead", "info");
    return;
  }
  const blob = await getBlobForFile(file);
  if (!blob) { toast("This file could not be read. Reconnect the folder.", "err"); return; }
  saveBlob(blob, file.name);
  toast("Downloading " + file.name, "ok");
}

/* ---------------------------- derived data ---------------------------- */
function totalSize() { return sum(state.files, (f) => f.size); }

function categoryStats() {
  const map = {};
  state.files.forEach((f) => {
    const key = f.category || "other";
    if (!map[key]) map[key] = { key, count: 0, bytes: 0 };
    map[key].count++;
    map[key].bytes += f.size;
  });
  return Object.values(map).sort((a, b) => b.bytes - a.bytes);
}

function folderCount() {
  if (!state.files.length && !state.folders.length) return 0;
  const set = new Set(state.folders.map((f) => f.path));
  return set.size;
}

function sortedFiles(sort, dir) {
  const getters = {
    name: (f) => f.name.toLowerCase(),
    size: (f) => f.size,
    mtime: (f) => f.mtime || 0,
    category: (f) => f.category,
    path: (f) => f.path.toLowerCase(),
  };
  const get = getters[sort] || getters.size;
  const list = state.files.slice().sort((a, b) => {
    const va = get(a);
    const vb = get(b);
    if (va < vb) return -1;
    if (va > vb) return 1;
    return a.path.localeCompare(b.path);
  });
  return dir === -1 ? list.reverse() : list;
}

function filteredFiles() {
  const f = state.filters;
  const q = f.query.trim().toLowerCase();
  return sortedFiles(f.sort, f.dir).filter((file) => {
    if (f.category !== "all" && file.category !== f.category) return false;
    if (f.source !== "all" && file.rootId !== f.source) return false;
    if (q && !(file.name.toLowerCase().includes(q) || file.path.toLowerCase().includes(q))) return false;
    return true;
  });
}

function largestFiles(n = 6) {
  return sortBy(state.files, (f) => -f.size).slice(0, n);
}

function freeCloudTotal() { return sum(FREE_TIERS, (t) => t.gb); }

function claimableTotal() {
  const claimed = new Set(state.settings.claimed || []);
  return sum(FREE_TIERS.filter((t) => !claimed.has(t.name)), (t) => t.gb);
}

function needsPermission() { return state.sources.filter((s) => s.status === "needs-permission"); }

function cloudConfigured() { return !!(state.settings.cloud && state.settings.cloud.url && state.settings.cloud.key); }

function cloudUsageLabel() {
  if (!cloudConfigured()) return claimableTotal() + " GB";
  const usage = state.cloud.usage;
  const quotaGB = (state.settings.cloud.quotaGB || 1);
  if (usage == null) return quotaGB + " GB";
  return fmtBytes(Math.max(0, quotaGB * 1024 ** 3 - usage));
}

}

function render({ focus } = {}) {
  const app = document.getElementById("app");
  if (!app.dataset.built) {
    app.innerHTML = shellHTML();
    app.dataset.built = "1";
  } else {
    const active = document.querySelector(".nav-item.active");
    const nextActive = NAV_ITEMS.find((n) => n.id === state.view);
    if (active && nextActive) {
      // refresh nav in place (badges change often)
      const nav = document.querySelector(".nav");
      if (nav) nav.innerHTML = NAV_ITEMS.map((item) => {
        if (item.section) return `<div class="nav-label">${esc(item.section)}</div>`;
        const badge = item.badge ? navBadge(item.badge) : "";
        return `<button class="nav-item ${state.view === item.id ? "active" : ""}" data-action="navigate" data-view="${item.id}">
          ${icon(item.icon)}<span>${esc(item.label)}</span>
          ${badge ? `<span class="nav-badge">${badge}</span>` : ""}
        </button>`;
      }).join("");
    }
    const top = document.querySelector(".topbar");
    if (top) {
      const meta = PAGE_META[state.view] || PAGE_META.dashboard;
      const crumb = top.querySelector(".crumb");
      const h1 = top.querySelector("#page-title");
      if (crumb) crumb.innerHTML = `${esc(meta.crumb)} <span>/</span> Explorchive`;
      if (h1) h1.textContent = meta.title;
      const scanBtn = top.querySelector('[data-action="scan"] .btn-txt');
      if (scanBtn) scanBtn.textContent = state.scanning ? "Scanning…" : "Rescan";
    }
  }

  const view = document.getElementById("view");
  if (!view) return;
  const scrollY = window.scrollY;
  const html = viewHTML(state.view);
  view.innerHTML = html;
  view.classList.remove("view");
  void view.offsetWidth;
  view.classList.add("view");
  if (!document.body.dataset.firstRender) {
    document.body.dataset.firstRender = "1";
  } else {
    // keep the user's scroll position for in-place updates
    window.scrollTo({ top: scrollY, behavior: "instant" in window ? "instant" : "auto" });
  }

  if (focus) {
    const el = document.getElementById(focus);
    if (el) {
      el.focus({ preventScroll: true });
      if (el.setSelectionRange && typeof el.value === "string") {
        try { el.setSelectionRange(el.value.length, el.value.length); } catch {}
      }
    }
  }
  renderScanOverlay();
  document.body.classList.toggle("has-scan", state.scan.active);
  maybeEstimateStorage();
  afterRenderUI();
}

function viewHTML(view) {
  switch (view) {
    case "files": return filesViewHTML();
    case "organize": return organizeViewHTML();
    case "duplicates": return duplicatesViewHTML();
    case "cleanup": return cleanupViewHTML();
    case "cloud": return cloudViewHTML();
    case "reports": return reportsViewHTML();
    case "settings": return settingsViewHTML();
    default: return dashboardViewHTML();
  }
}

function donutSVG(cats, total) {
  const R = 60;
  const C = 2 * Math.PI * R;
  let offset = 0;
  const segments = cats.map((c) => {
    const frac = total ? c.bytes / total : 0;
    const len = Math.max(0, frac * C - 2);
    const seg = `<circle cx="86" cy="86" r="${R}" fill="none" stroke="${CATEGORIES[c.key].color}" stroke-width="19" stroke-linecap="round" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-offset}" opacity=".92"/>`;
    offset += frac * C;
    return seg;
  }).join("");
  return `<svg viewBox="0 0 172 172" role="img" aria-label="Storage by file category">
    <circle cx="86" cy="86" r="${R}" fill="none" stroke="#EFF7FD" stroke-width="19"/>
    ${segments}
  </svg>`;
}

function miniEmpty(ico, title, text) {
  return `<div class="empty" style="padding:26px 12px">
    <div class="empty-art" style="width:54px;height:54px;border-radius:16px">${icon(ico)}</div>

}

/* ---------------------------- file drawer ---------------------------- */
async function openFileDrawer(file) {
  if (!file) return;
  closeModal();
  const source = sourceById(file.rootId);
  const root = document.getElementById("modal-root");
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop drawer-bg";
  backdrop.innerHTML = `
    <aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(file.name)}">
      <div class="drawer-head">
        <span class="file-ico" style="width:34px;height:34px">${icon(CATEGORIES[file.category].icon)}</span>
        <div class="grow" style="min-width:0">
          <div style="font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(file.name)}</div>
          <div class="tiny muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(file.path)}</div>
        </div>
        <button class="icon-btn" data-close aria-label="Close preview">${icon("x")}</button>
      </div>
      <div class="drawer-body">
        <div class="preview-box" id="drawer-preview">
          <div class="preview-fallback">${icon("eye")}<span>Loading preview…</span></div>
        </div>
        <div class="kv">
          <div class="kv-row"><span class="k">Category</span><span class="v"><span class="badge cat-${file.category}">${esc(CATEGORIES[file.category].label)}</span></span></div>
          <div class="kv-row"><span class="k">Size</span><span class="v">${fmtBytes(file.size)} <span class="tiny muted">(${fmtCount(file.size)} bytes)</span></span></div>
          <div class="kv-row"><span class="k">Modified</span><span class="v">${esc(dateTimeStr(file.mtime))}</span></div>
          <div class="kv-row"><span class="k">Location</span><span class="v" style="max-width:250px;word-break:break-word">${esc(file.path)}</span></div>
          <div class="kv-row"><span class="k">Source</span><span class="v">${esc(source ? source.name : "Unknown")}${source && source.demo ? ' <span class="pill muted">demo</span>' : ""}</span></div>
          <div class="kv-row"><span class="k">Permissions</span><span class="v">${file.demo ? "Simulated" : file.rawFile ? "Read-only" : "Read + write"}</span></div>
        </div>
        ${file.demo ? `<div class="banner info" style="margin-top:14px">${icon("sparkles")}<div class="b-body">This is a demo file. The preview and download are simulated.</div></div>` : ""}
      </div>
      <div class="drawer-foot">
        <button class="btn primary sm" data-download>${icon("download")} Download</button>
        <button class="btn ghost sm" data-copy>${icon("copy")} Copy path</button>
        <span class="grow"></span>
        <button class="btn danger sm" data-delete>${icon("trash")} Delete</button>
      </div>
    </aside>`;
  root.appendChild(backdrop);

  const close = () => {
    backdrop.remove();
    document.removeEventListener("keydown", onKey);
    if (modalCloser === close) modalCloser = null;
  };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  modalCloser = close;
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
  backdrop.querySelector("[data-close]").addEventListener("click", close);
  backdrop.querySelector("[data-copy]").addEventListener("click", async () => {
    const ok = await copyText(file.path);
    toast(ok ? "Path copied" : "Could not copy path", ok ? "ok" : "err");
  });
  backdrop.querySelector("[data-download]").addEventListener("click", () => downloadFileObject(file));
  backdrop.querySelector("[data-delete]").addEventListener("click", async () => {
    const res = await deleteFileObjects([file], { confirm: true });
    if (res.deleted) close();
  });

  const box = backdrop.querySelector("#drawer-preview");
  let objectUrl = null;
  try {
    const data = await previewData(file);
    if (!backdrop.isConnected) { if (data.url) URL.revokeObjectURL(data.url); return; }
    if (data.type === "image") {
      objectUrl = data.url;
      box.innerHTML = `<img alt="Preview of ${esc(file.name)}" src="${data.url}" />`;
    } else if (data.type === "text") {
      box.innerHTML = `<pre>${esc(data.text)}</pre>`;
    } else {
      box.innerHTML = `<div class="preview-fallback">${icon(CATEGORIES[file.category].icon)}<strong style="color:var(--ink-2);font-size:12.5px">${esc(file.name)}</strong><span>${file.demo ? "Demo file — no binary content" : "No inline preview for this format"}<br/>Use Download to open it with your system apps.</span></div>`;
    }
  } catch {
    box.innerHTML = `<div class="preview-fallback">${icon("alert")}<span>Preview unavailable. The folder may need reconnecting.</span></div>`;
  }
  const originalClose = modalCloser;
  if (objectUrl) {
    const revoke = () => URL.revokeObjectURL(objectUrl);
    const observer = new MutationObserver(() => {
      if (!backdrop.isConnected) { revoke(); observer.disconnect(); }
    });
    observer.observe(document.getElementById("modal-root"), { childList: true });
    void originalClose;
  }
}

  const label = { large: "Large files", old: "Untouched files", junk: "Junk files", empty: "Empty folders" }[kind];

/* ---------------------------- cloud ---------------------------- */
function cloudCfg() { return state.settings.cloud || null; }
function cloudBase() { const c = cloudCfg(); return c ? String(c.url || "").replace(/\/+$/, "") : ""; }

async function cloudRequest(path, { method = "GET", body = null, headers = {} } = {}) {
  const cfg = cloudCfg();
  if (!cfg) throw new Error("Cloud vault is not configured");
  let res;
  try {
    res = await fetch(cloudBase() + path, {
    method,
      headers: {
        apikey: cfg.key,
        Authorization: "Bearer " + cfg.key,
        ...(body ? { "Content-Type": "application/json" } : {}),
        ...headers,
      },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (err) {
    const host = (() => { try { return new URL(cloudBase()).host; } catch { return "the project URL"; } })();
    throw new Error(`Could not reach ${host}. Check the URL, your connection, and that the project is awake.`);
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    const message = (data && (data.message || data.error_description || data.error)) || (typeof data === "string" ? data : "") || ("HTTP " + res.status);
    throw new Error(message + (res.status === 401 ? " — check the anon key" : res.status === 403 ? " — storage policies are blocking this key" : ""));
  }
  return data;
}

async function listCloudObjects(bucket, prefix = "", depth = 0, out = []) {
  let offset = 0;
  const PAGE = 100;
  while (true) {
    const batch = await cloudRequest("/storage/v1/object/list/" + encodeURIComponent(bucket), {
      method: "POST",
      body: { prefix, limit: PAGE, offset, sortBy: { column: "name", order: "asc" } },
    });
    if (!Array.isArray(batch)) throw new Error("Unexpected response from storage list");
    for (const item of batch) {
      const full = prefix ? prefix + "/" + item.name : item.name;
      const isFolder = !item.id || !item.metadata || item.metadata === null;
      if (isFolder) { if (depth < 8) await listCloudObjects(bucket, full, depth + 1, out); }
      else out.push({
        name: full,
        size: Number(item.metadata.size) || 0,
        updated: item.updated_at,
        mimetype: item.metadata.mimetype || "application/octet-stream",
        id: item.id,
      });
    }
    if (batch.length < PAGE) break;
    offset += PAGE;
  }
  return out;
}

async function testCloud({ quiet = false } = {}) {
  if (!cloudConfigured()) return;
  state.cloud.busy = true;
  state.cloud.status = "connecting";
  state.cloud.error = "";
  render();
  try {
    const cfg = cloudCfg();
    let buckets;
    try { buckets = await cloudRequest("/storage/v1/bucket"); }
    catch (err) {
      throw new Error(err.message + ". The anon key needs read access to Storage. Check your Supabase policies.");
    }
    state.cloud.buckets = Array.isArray(buckets) ? buckets : [];
    let bucketName = cfg.bucket || "explorchive";
    let exists = state.cloud.buckets.some((b) => (b.name || b.id) === bucketName);
    if (!exists) {
      try {
        await cloudRequest("/storage/v1/bucket", { method: "POST", body: { name: bucketName, id: bucketName, public: false } });
        exists = true;
        if (!quiet) toast('Bucket "' + bucketName + '" created in your Supabase project', "ok");
      } catch (err) {
        throw new Error('Bucket "' + bucketName + '" is missing and could not be created (' + err.message + "). Create it in Supabase → Storage, or paste another bucket name.");
      }
    }
    const objects = await listCloudObjects(bucketName);
    state.cloud.objects = objects;
    state.cloud.usage = sum(objects, (o) => o.size);
    state.cloud.status = "ready";
    state.cloud.lastChecked = Date.now();
    if (!quiet) toast("Cloud vault connected · " + fmtBytes(state.cloud.usage) + " used", "ok");
  } catch (err) {
    state.cloud.status = "error";
    state.cloud.error = err.message || String(err);
    if (!quiet) toast("Cloud vault: " + state.cloud.error, "err");
  } finally {
    state.cloud.busy = false;
    render();
  }
}

async function refreshCloudUsage({ quiet = true } = {}) {
  if (!cloudConfigured()) return;
  try {
    const bucket = cloudCfg().bucket || "explorchive";
    const objects = await listCloudObjects(bucket);
    state.cloud.objects = objects;
    state.cloud.usage = sum(objects, (o) => o.size);
    state.cloud.status = "ready";
    state.cloud.error = "";
    if (!quiet) toast("Usage refreshed · " + fmtBytes(state.cloud.usage), "ok");
  } catch (err) {
    state.cloud.status = "error";
    state.cloud.error = err.message;
    if (!quiet) toast(err.message, "err");
  }
  render();
}

async function cloudUploadSelected() {
  if (!cloudConfigured()) { toast("Connect a cloud vault first", "err"); return; }
  const files = Array.from(state.uploadSelection).map(fileById).filter(Boolean).filter((f) => !f.demo);
  if (!files.length) { toast("Select files from a real folder to back up", "info"); return; }
  if (!state.sources.some((s) => !s.demo && (s.handle || s.rawFiles))) { toast("Connect a real folder first — demo files cannot be uploaded", "err"); return; }
  const cfg = cloudCfg();
  const bucket = cfg.bucket || "explorchive";
  state.cloud.busy = true;
  state.cloud.upload = { total: files.length, done: 0, current: "", bytes: 0, failed: 0, startedAt: Date.now() };
  render();
  let uploaded = 0;
  let failed = 0;
  let bytes = 0;

  for (const file of files) {
    state.cloud.upload.current = file.name;
    render();
    try {
      const blob = await getBlobForFile(file);
      if (!blob) throw new Error("unreadable");
      const year = new Date(file.mtime || Date.now()).getFullYear();
      const safeName = file.name.replace(/[#?%]/g, "_");
      const path = ["explorchive", String(year), file.category, safeName].map(encodeURIComponent).join("/");
      let response;
      try {
        response = await fetch(cloudBase() + "/storage/v1/object/" + encodeURIComponent(bucket) + "/" + path, {
        method: "POST",
        headers: {
          apikey: cfg.key,
          Authorization: "Bearer " + cfg.key,
          "x-upsert": "true",
          "Content-Type": blob.type || "application/octet-stream",
          "cache-control": "3600",
        },
          body: blob,
        });
      } catch {
        throw new Error("network — could not reach the bucket");
      }
      if (!response.ok) {
        const t = await response.text();
        let msg = t;
        try { msg = JSON.parse(t).message || t; } catch {}
        throw new Error(msg || "HTTP " + response.status);
      }
      uploaded++;
      bytes += blob.size;
    } catch (err) {
      failed++;
      if (failed === 1) toast("Upload issue: " + (err.message || err.name), "err");
    }
    state.cloud.upload.done = uploaded + failed;
    state.cloud.upload.bytes = bytes;
    state.cloud.upload.failed = failed;
    const bar = document.querySelector("[data-upload-bar]");
    if (bar) bar.style.width = pct(uploaded + failed, files.length) + "%";
    const label = document.querySelector("[data-upload-label]");
    if (label) label.textContent = `${uploaded + failed} / ${files.length} · ${file.name}`;
  }

  state.cloud.upload = null;
  state.cloud.busy = false;
  state.uploadSelection.clear();
  state.cloud.lastUpload = { at: Date.now(), uploaded, failed, bytes };
  await refreshCloudUsage({ quiet: true });
  render();
  if (uploaded) toast(`${fmtCount(uploaded)} files backed up · ${fmtBytes(bytes)}${failed ? ` · ${failed} failed` : ""}`, "ok", "Cloud vault");
  if (!uploaded && failed) toast("Upload failed. Check bucket policies and CORS in Supabase.", "err");
}

async function deleteCloudObject(name) {
  const cfg = cloudCfg();
  if (!cfg) return;
  const ok = await confirmModal({
    title: "Delete from the cloud vault?",
    message: `Remove <strong>${esc(baseOfPath(name))}</strong> from bucket <span class="mono">${esc(cfg.bucket)}</span>? This frees space in your cloud account.`,
    confirmLabel: "Delete object",
    tone: "danger",
    iconName: "cloud",
  });
  if (!ok) return;
  try {
    const path = name.split("/").map(encodeURIComponent).join("/");
    await cloudRequest("/storage/v1/object/" + encodeURIComponent(cfg.bucket) + "/" + path, { method: "DELETE" });
    toast("Object deleted from cloud vault", "ok");
    await refreshCloudUsage({ quiet: true });
  } catch (err) {
    toast("Delete failed: " + err.message, "err");
  }
}

async function openSignedLink(name) {
  const cfg = cloudCfg();
  if (!cfg) return;
  try {
    const path = name.split("/").map(encodeURIComponent).join("/");
    const data = await cloudRequest("/storage/v1/object/sign/" + encodeURIComponent(cfg.bucket) + "/" + path, {
      method: "POST",
      body: { expiresIn: 3600 },
    });
    if (!data || !data.signedURL) throw new Error("No signed URL returned");
    const url = data.signedURL.startsWith("http") ? data.signedURL : cloudBase() + "/storage/v1" + data.signedURL;
    window.open(url, "_blank", "noopener");
    toast("Signed link created — valid for 1 hour", "ok");
  } catch (err) {
    toast("Could not create link: " + err.message, "err");
  }
}

    totals: {
      files: state.files.length,
      folders: folderCount(),
      bytes: totalSize(),
      categories: categoryStats().map((c) => ({ category: CATEGORIES[c.key].label, files: c.count, bytes: c.bytes })),
    },
    duplicates: state.dupes.groups ? {
      groups: state.dupes.groups.length,
      reclaimableBytes: state.dupes.reclaimable,
      strict: state.dupes.strict,
    } : { scanned: false },
    cleanup: (() => {
      const b = cleanupBuckets();
      return {
        largeFiles: { count: b.large.files.length, bytes: b.large.bytes },
        untouchedForAYear: { count: b.old.files.length, bytes: b.old.bytes },
        junkFiles: { count: b.junk.files.length, bytes: b.junk.bytes },
        emptyFolders: { count: b.empty.folders.length },
      };
    })(),
    cloud: {
      configured: cloudConfigured(),
      bucket: cloudConfigured() ? cloudCfg().bucket : null,
      usedBytes: state.cloud.usage,
      freeTiersGB: claimableTotal(),
    },
    largestFiles: largestFiles(25).map((f) => ({ name: f.name, path: f.path, bytes: f.size, modified: new Date(f.mtime).toISOString(), category: CATEGORIES[f.category].label })),
  };
}

function reportTxt() {
  const r = buildReport();
  const lines = [];
  lines.push("EXPLORCHIVE LIBRARY REPORT");
  lines.push("Generated " + new Date(r.generatedAt).toLocaleString());
  lines.push("=".repeat(52));
  lines.push("");
  lines.push("SOURCES");
  r.sources.forEach((s) => lines.push(`  • ${s.name}${s.demo ? " (demo)" : ""} — ${fmtCount(s.files)} files`));
  lines.push("");
  lines.push("TOTALS");
  lines.push(`  Files:    ${fmtCount(r.totals.files)}`);
  lines.push(`  Folders:  ${fmtCount(r.totals.folders)}`);
  lines.push(`  Size:     ${fmtBytes(r.totals.bytes)}`);
  lines.push("");
  lines.push("BY CATEGORY");
  r.totals.categories.forEach((c) => lines.push(`  ${c.category.padEnd(12)} ${String(c.files).padStart(6)} files  ${fmtBytes(c.bytes)}`));
  lines.push("");
  lines.push("CLEANUP");
  lines.push(`  Large files:        ${fmtCount(r.cleanup.largeFiles.count)} (${fmtBytes(r.cleanup.largeFiles.bytes)})`);
  lines.push(`  Untouched 1 year:   ${fmtCount(r.cleanup.untouchedForAYear.count)} (${fmtBytes(r.cleanup.untouchedForAYear.bytes)})`);
  lines.push(`  Junk files:         ${fmtCount(r.cleanup.junkFiles.count)} (${fmtBytes(r.cleanup.junkFiles.bytes)})`);
  lines.push(`  Empty folders:      ${fmtCount(r.cleanup.emptyFolders.count)}`);
  lines.push("");
  lines.push("DUPLICATES");
  if (r.duplicates.scanned) {
    lines.push(`  Groups: ${r.duplicates.groups}`);
    lines.push(`  Reclaimable: ${fmtBytes(r.duplicates.reclaimableBytes)}`);
  } else lines.push("  Not scanned");
  lines.push("");
  lines.push("LARGEST FILES");
  r.largestFiles.slice(0, 10).forEach((f) => lines.push(`  ${fmtBytes(f.bytes).padStart(9)}  ${f.path}`));
  lines.push("");
  lines.push("Generated locally by Explorchive — no data left this device.");
  return lines.join("\n");
}

function reportCSV() {
  const rows = [["name", "path", "category", "bytes", "modified", "source"]];
  state.files.forEach((f) => {
    const source = sourceById(f.rootId);
    rows.push([f.name, f.path, CATEGORIES[f.category].label, f.size, new Date(f.mtime).toISOString(), source ? source.name : ""]);
  });
  return rows.map((r) => r.map((cell) => {
    const s = String(cell == null ? "" : cell);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\n");
}

/* ---------------------------- navigation ---------------------------- */
function currentHashView() {
  const raw = location.hash.replace(/^#\/?/, "").split("?")[0];
  return PAGE_META[raw] ? raw : null;
}

function navigate(view) {
  if (!PAGE_META[view]) view = "dashboard";
  setMenu(false);
  const changed = state.view !== view;
  state.view = view;
  if (location.hash !== "#/" + view) {
    try { location.hash = "#/" + view; } catch {}
  }
  if (changed) {
    state.filters.page = 1;
    window.scrollTo({ top: 0, behavior: "auto" });
    const viewEl = document.getElementById("view");
    if (viewEl) viewEl.focus({ preventScroll: true });
  }
  render();
}

function setMenu(open) {
  const sidebar = document.getElementById("sidebar");
  const scrim = document.getElementById("scrim");
  if (!sidebar) return;
  sidebar.classList.toggle("open", open);
  if (scrim) scrim.hidden = !open;
}

function toggleMenu() {
  const sidebar = document.getElementById("sidebar");
  if (!sidebar) return;
  setMenu(!sidebar.classList.contains("open"));
}

/* ---------------------------- utility flows ---------------------------- */
async function downloadAppFile() {
  const candidates = ["Explorchive.html", "dist/Explorchive.html"];
  for (const candidate of candidates) {
    try {
      const res = await fetch(candidate, { cache: "no-store" });
      if (!res.ok) continue;
      const blob = await res.blob();
      if (blob.size < 5000) continue;
      saveBlob(blob, "Explorchive.html");
      toast("Downloaded Explorchive.html — one file, no installer", "ok", "Take it with you");
      return;
    } catch {}
  }
  if (location.protocol === "file:") {
    openModal({
      title: "Save this page as your app",
      sub: "You are already running the single-file build",
      iconName: "download",
      body: `<p style="font-size:12.5px;line-height:1.65;color:var(--ink-2)">
        Explorchive is running from a local file, so the browser cannot fetch a second copy automatically.
        Use <strong>Ctrl+S</strong> (Windows) or <strong>⌘S</strong> (macOS) and save the page as
        <span class="mono">Explorchive.html</span>. The saved file is the entire app and works offline.</p>
        <div class="banner info" style="margin-top:12px">${icon("info")}<div class="b-body">If you opened the repository copy, download <span class="mono">dist/Explorchive.html</span> instead.</div></div>`,
      actions: [{ label: "Got it", cls: "primary" }],
    });
    return;
  }
  openModal({
    title: "Download unavailable here",

function exportReport(kind) {
  const stamp = new Date().toISOString().slice(0, 10);
  if (kind === "json") {
    saveBlob(new Blob([JSON.stringify(buildReport(), null, 2)], { type: "application/json" }), `explorchive-report-${stamp}.json`);
    toast("JSON report downloaded", "ok");
  } else if (kind === "csv") {
    saveBlob(new Blob([reportCSV()], { type: "text/csv" }), `explorchive-files-${stamp}.csv`);
    toast("File index downloaded", "ok");
  } else {
    saveBlob(new Blob([reportTxt()], { type: "text/plain" }), `explorchive-summary-${stamp}.txt`);
    toast("Summary downloaded", "ok");
  }
}

async function copyReport() {

function clearDemo() {
  state.sources = state.sources.filter((s) => !s.demo);
  state.files = state.files.filter((f) => !f.demo);
  state.folders = state.folders.filter((f) => !f.demo);
  if (!state.sources.length) state.scannedAt = null;
  state.selection.clear();
  state.dupes = { groups: null, reclaimable: 0, busy: false, strict: false, scannedAt: null };
  state.organize.plan = null;
  saveSettings({ demoHidden: true });
  render();
  toast("Demo cleared — add a folder to build your own library", "info");
}

async function resetAll() {
  const ok = await confirmModal({
    title: "Reset Explorchive?",
    message: "Saved folders, permissions and cloud credentials stored by this app will be removed. Your real files are never touched. The demo reloads.",
    confirmLabel: "Reset app",
    tone: "danger",
    iconName: "alert",
  });
  if (!ok) return;
  try { localStorage.removeItem(LS_KEY); } catch {}
  try {
    await new Promise((resolve) => {
      const req = indexedDB.deleteDatabase(DB_NAME);
      req.onsuccess = req.onerror = req.onblocked = resolve;
    });
  } catch {}
  location.reload();
}

function downloadSelected() {
  const files = state.files.filter((f) => state.selection.has(f.id));
  if (!files.length) return;
  files.forEach((f, i) => {
    setTimeout(() => downloadFileObject(f), i * 220);
  });
  toast("Preparing " + fmtCount(files.length) + " downloads…", "ok");
}

function pickLargestForUpload() {
  const real = sortBy(state.files.filter((f) => !f.demo), (f) => -f.size).slice(0, 10);
  state.uploadSelection = new Set(real.map((f) => f.id));
  render();
  toast(real.length ? `${real.length} largest files selected` : "No real files available", real.length ? "info" : "err");
}

/* ---------------------------- action map ---------------------------- */

  "close-menu": () => setMenu(false),
  "add-folder": () => pickFolder(),

    if (!activeSources().length) {
      toast("The demo library is always up to date. Add a folder to scan your own files.", "info");
      return;
    }
    scanAll();
  },
  "clear-demo": () => clearDemo(),

  "reset-demo": () => resetDemo(),
  "remove-source": (data) => removeSource(data.id),
  "reconnect-source": (data) => reconnectSource(data.id),
  "sort-files": (data, el) => {
    const sort = data.sort || el.value;
    if (el && el.tagName === "SELECT") {
      state.filters.sort = sort;
      state.filters.dir = sort === "name" || sort === "path" || sort === "category" ? 1 : -1;
    } else if (state.filters.sort === sort) {
      state.filters.dir = state.filters.dir === 1 ? -1 : 1;

      state.filters.sort = sort;
      state.filters.dir = sort === "name" || sort === "path" || sort === "category" ? 1 : -1;

    render();
  },
  "filter-category": (data) => {
    state.filters.category = data.cat;
    state.filters.page = 1;
    render();
  },
  page: (data) => {
    state.filters.page = Math.max(1, parseInt(data.page, 10) || 1);
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  },
  "preview-file": (data) => openFileDrawer(fileById(data.id)),
  "open-file": (data) => openFileDrawer(fileById(data.id)),
  "delete-file": async (data) => {
    const file = fileById(data.id);
    if (file) await deleteFileObjects([file], { confirm: true });
  },
  "delete-selected": async () => {
    const files = state.files.filter((f) => state.selection.has(f.id));
    if (files.length) await deleteFileObjects(files, { confirm: true });
  },
  "download-selected": () => downloadSelected(),
  "clear-selection": () => { state.selection.clear(); render(); },
  "clear-filters": () => {
    state.filters.query = "";
    state.filters.category = "all";
    state.filters.source = "all";
    state.filters.page = 1;
    const gs = document.getElementById("global-search");
    if (gs) gs.value = "";
    render();
    toast("Filters cleared", "info");
  },
  "scan-duplicates": () => {
    if (state.dupes.busy) return;
    scanDuplicates();
  },
  "set-keep": (data) => setKeep(data.group, data.id),
  "delete-group-extras": async (data) => {
    const group = state.dupes.groups && state.dupes.groups.find((g) => g.id === data.id);
    if (!group) return;
    const extras = group.files.filter((f) => f.id !== group.keepId);
    const ok = await confirmModal({
      title: `Delete ${extras.length} duplicate ${plural(extras.length, "copy", "copies")}?`,
      message: `Keeps <strong>${esc((group.files.find((f) => f.id === group.keepId) || group.files[0]).path)}</strong> and permanently deletes the other ${extras.length} copies, freeing <strong>${fmtBytes(group.wasted)}</strong>.`,
      confirmLabel: "Delete copies",
      tone: "danger",
      iconName: "duplicates",
    });
    if (ok) await deleteFileObjects(extras, { confirm: false });
  },
  "delete-all-dupes": async () => {
    if (!state.dupes.groups || !state.dupes.groups.length) return;
    const extras = [];
    state.dupes.groups.forEach((g) => g.files.forEach((f) => { if (f.id !== g.keepId) extras.push(f); }));
    const ok = await confirmModal({
      title: `Delete ${fmtCount(extras.length)} extra copies?`,
      message: `One copy of each group is kept. This frees about <strong>${fmtBytes(sum(extras, (f) => f.size))}</strong> and cannot be undone.`,
      confirmLabel: "Delete all copies",
      tone: "danger",
      iconName: "duplicates",
    });
    if (ok) await deleteFileObjects(extras, { confirm: false });
  },
  "organize-scheme": (data) => {
    state.organize.scheme = data.scheme;
    state.organize.plan = null;
    render();
  },
  "organize-scan-first": async () => {
    if (!activeSources().length) { toast("This is the demo library — it's already scanned", "info"); return; }
    await scanAll({ quiet: true });
    if (state.files.length) {
      state.organize.plan = buildOrganizePlan();
      render();
      toast("Library rescanned and a fresh plan is ready", "ok");
    }
  },
  "preview-plan": () => {
    if (!state.files.length) return;
    const plan = buildOrganizePlan();
    state.organize.plan = plan;
    render();
    if (!plan.length) {
      toast("Everything already follows this structure. Try another scheme or include subfolders.", "info");
      return;
    }
    setTimeout(() => {
      const target = document.querySelector(".plan-summary");
      if (target && target.scrollIntoView) target.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 80);
  },
  "cancel-plan": () => { state.organize.plan = null; render(); },
  "apply-plan": () => applyOrganizePlan(),
  "undo-organize": () => undoOrganize(),
  "review-cleanup": (data) => openCleanupReview(data.kind),
  "cleanup-delete": async (data) => {
    const buckets = cleanupBuckets();
    const bucket = buckets[data.kind];
    if (!bucket) return;
    if (data.kind === "empty") { await deleteEmptyFolders(); return; }
    if (!bucket.files.length) { toast("Nothing to delete", "info"); return; }
    const ok = await confirmModal({
      title: `Delete ${fmtCount(bucket.files.length)} ${plural(bucket.files.length, "file", "files")}?`,
      message: `This permanently removes <strong>${fmtBytes(bucket.bytes)}</strong> matched by this rule. Consider reviewing the list first.`,

      tone: "danger",
      iconName: "cleanup",
    });
    if (ok) await deleteFileObjects(bucket.files, { confirm: false });
  },
  "claim-provider": (data) => {
    const claimed = new Set(state.settings.claimed || []);
    if (claimed.has(data.name)) claimed.delete(data.name);
    else claimed.add(data.name);

  "open-providers": () => openProviders(),
  "cloud-test": () => testCloud(),

      iconName: "key",

  },
  "cloud-disconnect": async () => {

    render();

  },
  "cloud-upload": () => cloudUploadSelected(),
  "upload-select-largest": () => pickLargestForUpload(),
  "cloud-link": (data) => openSignedLink(data.name),

  "print-report": () => printReport(),
  "download-app": () => downloadAppFile(),

const CHANGES = {
  "select-file": (el) => {
    if (el.checked) state.selection.add(el.dataset.id);
    else state.selection.delete(el.dataset.id);
    render();
  },
  "select-page": (el) => {
    const f = state.filters;
    const list = filteredFiles();
    const start = (clamp(f.page, 1, Math.max(1, Math.ceil(list.length / f.pageSize))) - 1) * f.pageSize;
    const pageRows = list.slice(start, start + f.pageSize);
    pageRows.forEach((file) => {
      if (el.checked) state.selection.add(file.id);
      else state.selection.delete(file.id);
    });
    render();
  },
  "filter-source": (el) => {
    state.filters.source = el.value;
    state.filters.page = 1;
    render();
  },
  "sort-files": (el) => ACTIONS["sort-files"]({ sort: el.value }, el),
  "page-size": (el) => {
    state.filters.pageSize = parseInt(el.value, 10) || 40;
    state.filters.page = 1;
    render();
  },
  "organize-scope": (el) => {
    state.organize.includeSubfolders = el.checked;
    state.organize.plan = null;
    render();
  },
  "dupes-strict": (el) => {
    state.dupes.strict = el.checked;
    render();
  },
  "autopilot-toggle": (el) => {

const SUBMITS = {
  "cloud-connect": (form) => {
    const fd = new FormData(form);
    let url = String(fd.get("url") || "").trim().replace(/\/+$/, "");
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    const key = String(fd.get("key") || "").trim();
    const bucket = String(fd.get("bucket") || "").trim() || "explorchive";
    const quotaGB = Number(fd.get("quota")) || 1;

    state.settings.cloud = { url, key, bucket, quotaGB };

    state.cloud.status = "idle";

    toast("Credentials saved locally — testing connection…", "info");
    setTimeout(() => testCloud({ quiet: false }), 120);

};

/* ---------------------------- storage detection ---------------------------- */
let quotaRequested = false;
function maybeEstimateStorage() {
  if (quotaRequested) return;
  if (!navigator.storage || !navigator.storage.estimate) return;
  quotaRequested = true;
  navigator.storage.estimate().then((est) => {
    state.localQuota = { usage: est.usage || 0, quota: est.quota || 0 };
    const el = document.getElementById("local-quota");
    if (el && state.localQuota.quota) el.textContent = fmtBytes(state.localQuota.quota) + " total";
  }).catch(() => { quotaRequested = false; });
}

function renderScanOverlay() {
  // Scanning progress is shown through the body-level #busy panel created by showBusy().
  // This hook keeps the scan state in sync with the shell without rebuilding that panel.
  const scanLabel = document.querySelector("[data-action='scan'] .btn-txt");
  if (scanLabel) scanLabel.textContent = state.scanning ? "Scanning…" : "Rescan";
}

function afterRenderUI() {
  $$("[data-indeterminate='1']").forEach((el) => { el.indeterminate = true; });
  document.title = "Explorchive — " + (PAGE_META[state.view] || PAGE_META.dashboard).title;
  if (state.view === "cloud" && cloudConfigured() && state.cloud.status === "idle" && !state.cloud.autoTried) {
    state.cloud.autoTried = true;
    setTimeout(() => testCloud({ quiet: true }), 200);
  }
}

/* ---------------------------- events ---------------------------- */
function setupEvents() {
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = ACTIONS[el.dataset.action];
    if (!action) return;
    e.preventDefault();
    try { action(el.dataset, el, e); }
    catch (err) { console.error(err); toast(err.message || "Something went wrong", "err"); }
  });

  document.addEventListener("change", (e) => {
    const el = e.target.closest("[data-change]");
    if (!el) return;
    const handler = CHANGES[el.dataset.change];
    if (handler) {
      try { handler(el, e); }
      catch (err) { console.error(err); toast(err.message || "Something went wrong", "err"); }
    }
  });

  document.addEventListener("input", (e) => {
    const el = e.target.closest("[data-input]");
    if (!el) return;
    const handler = INPUTS[el.dataset.input];
    if (handler) handler(el.value, el);
  });

  document.addEventListener("submit", (e) => {
    const form = e.target.closest("[data-submit]");
    if (!form) return;
    e.preventDefault();
    const handler = SUBMITS[form.dataset.submit];
    if (handler) handler(form);
  });

  window.addEventListener("hashchange", () => {
    const view = currentHashView();
    if (view && view !== state.view) {
      state.view = view;
      state.filters.page = 1;
      setMenu(false);
      window.scrollTo({ top: 0, behavior: "auto" });
      render();
    }
  });

  document.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) || "";
    const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.target.isContentEditable;
    if (e.key === "/" && !typing) {
      e.preventDefault();
      const search = document.getElementById("global-search");
      if (search) search.focus();
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      const search = document.getElementById("global-search");
      if (search) search.focus();
    }
    if (e.key === "Enter" && e.target && e.target.id === "global-search") {
      state.filters.query = e.target.value.trim();
      state.filters.page = 1;
      if (state.view !== "files") navigate("files");
      else render();
    }
    if (e.key === "Escape") setMenu(false);
  });

  window.addEventListener("resize", () => {
    if (window.innerWidth > 980) setMenu(false);
  });

  window.addEventListener("beforeunload", (e) => {
    if (state.cloud.busy || state.organize.busy || state.scanning) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  /* drag & drop folders */
  let dragDepth = 0;
  window.addEventListener("dragenter", (e) => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes("Files")) return;
    dragDepth++;
    document.body.classList.add("dragging");
  });
  window.addEventListener("dragleave", () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) document.body.classList.remove("dragging");
  });
  window.addEventListener("dragover", (e) => { e.preventDefault(); });
  window.addEventListener("drop", async (e) => {
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove("dragging");
    const items = Array.from((e.dataTransfer && e.dataTransfer.items) || []);
    const handlePromises = items
      .filter((i) => i.kind === "file" && typeof i.getAsFileSystemHandle === "function")
      .map((i) => i.getAsFileSystemHandle().catch(() => null));
    let handles = [];
    try { handles = (await Promise.all(handlePromises)).filter((h) => h && h.kind === "directory"); } catch {}
    if (handles.length) {
      for (const handle of handles) await addSource(handle);
      toast(`${handles.length} ${plural(handles.length, "folder", "folders")} added`, "ok");
      return;
    }
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      toast("Drop a folder (not files) to scan it, or use Add folder", "info");
    }
  });
}

/* ---------------------------- boot ---------------------------- */
async function init() {
  setupEvents();
  const fallback = document.getElementById("fallback-input") || document.createElement("input");
  fallback.id = "fallback-input";
  fallback.type = "file";
  fallback.webkitdirectory = true;
  fallback.multiple = true;
  fallback.hidden = true;
  if (!fallback.isConnected) document.body.appendChild(fallback);
  fallback.addEventListener("change", () => fallbackFilesPicked(fallback));

  state.view = currentHashView() || "dashboard";
  render();

  const hadSaved = await restoreSources();
  if (!hadSaved && !state.settings.demoHidden) {
    loadDemo();
  }
  if (!hadSaved && state.settings.demoHidden) {
    state.files = [];
    state.folders = [];
  }
  render();
  afterRenderUI();

  if (!state.sources.length && !state.settings.demoHidden) {
    loadDemo();
    render();
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

window.Explorchive = Object.freeze({
  version: APP_VERSION,
  edition: 'Tokyo Sky',
  // Exposed for the test suite and for people who want to script the app.
  state,
  internals: Object.freeze({
    addSource, scanSource, scanAll, buildOrganizePlan, applyOrganizePlan, undoOrganize,
    deleteFileObjects, deleteEmptyFolders, scanDuplicates, loadDemo, render, navigate,
    categoryOf, extOf, isJunk, fmtBytes, cleanupBuckets, emptyFolders, ACTIONS,
  }),
});
})();

  </script>
</body>
